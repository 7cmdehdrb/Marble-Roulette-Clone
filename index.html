<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="description" content="구슬을 굴려 당첨자를 뽑는 마블 룰렛. 이름을 입력하고 네 가지 맵에서 레이스를 시작하세요." />
    <title>Marble Roulette 마블룰렛</title>
  </head>
  <body>
    <h1 class="sr-only">Marble Roulette 마블 룰렛 — 랜덤 추첨기</h1>
    <div id="loading" role="status">마블 룰렛을 준비하고 있습니다<span>● ● ●</span></div>
    <div id="settings" class="settings" aria-label="룰렛 설정">
      <div class="right">
        <button id="btnToggleSettings" class="btn-toggle-settings" aria-expanded="false" aria-controls="extraSettings">
          <span>설정</span><i class="toggle-arrow">▲</i>
        </button>
        <div id="extraSettings" class="collapsed collapsible-rows">
          <div class="row">
            <label for="sltMap"><i class="icon map" aria-hidden="true"></i> 맵</label>
            <div class="map-picker">
              <select id="sltMap" aria-label="맵 선택"></select>
              <button id="btnMoreMaps" class="btn-map-action" title="맵 둘러보기" aria-label="맵 둘러보기">+</button>
            </div>
          </div>
          <div class="row row-toggles">
            <div class="toggle-item">
              <label for="chkAutoRecording"><i class="icon record" aria-hidden="true"></i> 녹화</label>
              <input type="checkbox" id="chkAutoRecording" />
            </div>
            <div class="toggle-item">
              <label for="chkSkill"><i class="icon bomb" aria-hidden="true"></i> 스킬 활성화</label>
              <input type="checkbox" id="chkSkill" checked />
            </div>
          </div>
          <fieldset id="skillSettings" class="skill-settings" aria-describedby="skillSummary skillWeightHint">
            <legend>스킬 조절</legend>
            <div class="skill-controls">
              <div class="skill-control">
                <label for="skillCooldown">발동 간격 <output id="skillCooldownValue" for="skillCooldown">4.6초</output></label>
                <input id="skillCooldown" type="range" min="0.5" max="10" step="0.1" value="4.6" />
                <div class="skill-scale" aria-hidden="true"><span>자주</span><span>천천히</span></div>
              </div>
              <div class="skill-control">
                <label for="skillChance">발동 확률 <output id="skillChanceValue" for="skillChance">2%</output></label>
                <input id="skillChance" type="range" min="0" max="100" step="1" value="2" />
                <div class="skill-scale" aria-hidden="true"><span>0%</span><span>항상</span></div>
              </div>
              <div class="skill-control">
                <label for="skillStrength">밀어내는 힘 <output id="skillStrengthValue" for="skillStrength">1배</output></label>
                <input id="skillStrength" type="range" min="0.25" max="3" step="0.25" value="1" />
                <div class="skill-scale" aria-hidden="true"><span>약하게</span><span>강하게</span></div>
              </div>
              <div class="skill-control skill-limit">
                <label for="skillMaxUses">구슬당 최대 횟수</label>
                <div class="skill-count"><input id="skillMaxUses" type="number" min="0" max="100" step="1" value="0" aria-describedby="skillMaxUsesHint" /><span>회</span></div>
                <small id="skillMaxUsesHint">0이면 횟수 제한 없음</small>
              </div>
            </div>
            <div class="skill-footer"><p id="skillSummary" aria-live="polite"></p><button id="btnSkillDefaults" type="button">기본값</button></div>
            <p id="skillWeightHint" class="skill-hint">간격마다 확률을 확인합니다. /가중치 입력 시 간격·확률에 반영됩니다.</p>
          </fieldset>
          <div class="row">
            <label id="winnerLabel"><i class="icon trophy" aria-hidden="true"></i> 당첨 순위</label>
            <div class="btn-group" role="group" aria-labelledby="winnerLabel">
              <button class="btn-first-winner active" data-winner="first" aria-pressed="true">첫번째</button>
              <button class="btn-last-winner" data-winner="last" aria-pressed="false">마지막</button>
              <input type="number" id="in_winningRank" value="1" min="1" aria-label="당첨 순위 직접 입력" />
              <button class="btn-multi-winner" data-winner="multi" aria-pressed="false">여러명</button>
            </div>
          </div>
          <div class="row row-range">
            <div class="btn-group range-group">
              <input type="number" id="in_rangeStart" value="1" min="1" aria-label="당첨 시작 순위" />
              <span class="range-sep">~</span>
              <input type="number" id="in_rangeEnd" value="3" min="1" aria-label="당첨 마지막 순위" />
            </div>
          </div>
          <div class="row row-theme">
            <div class="theme">
              <i class="icon sun" aria-hidden="true"></i>
              <input type="checkbox" id="chkDarkMode" checked aria-label="다크 모드" />
              <i class="icon moon" aria-hidden="true"></i>
            </div>
          </div>
        </div>
      </div>
      <div class="left">
        <h3><label for="in_names">이름들을 입력하세요</label></h3>
        <textarea id="in_names" placeholder="이름들을 쉼표나 엔터로 구분해서 넣어주세요" spellcheck="false" aria-describedby="namesHint">수박*2,키위*2,귤*2</textarea>
        <p id="namesHint" class="names-hint">쉼표·줄바꿈으로 구분 · 수박*2는 구슬 2개<br />이름/3은 스킬 가중치 · 화면을 꾹 누르면 2배속</p>
        <div class="actions">
          <button id="btnShuffle" disabled><i class="icon shuffle" aria-hidden="true"></i><span>섞기</span></button>
          <button id="btnStart" disabled><i class="icon play" aria-hidden="true"></i><span>시작</span></button>
        </div>
      </div>
    </div>
    <button id="btnReset" class="race-reset" hidden title="경기를 멈추고 다시 준비">↶ 다시 준비</button>
    <dialog id="mapGallery" class="map-browser" aria-labelledby="mapGalleryTitle">
      <div class="mb-panel">
        <header class="mb-header"><h2 id="mapGalleryTitle" class="mb-title">맵 둘러보기</h2><button id="closeMaps" class="mb-close" aria-label="맵 선택 닫기">✕</button></header>
        <div class="mb-body"><div id="mapList" class="mb-list"></div></div>
      </div>
    </dialog>
    <div id="announcement" class="sr-only" aria-live="polite"></div>
    <div class="copyright">© 2022–2026. 마블 룰렛 by <a href="https://lazygyu.net" target="_blank" rel="noopener noreferrer">lazygyu</a> · MIT</div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
